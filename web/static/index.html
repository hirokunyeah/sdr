<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RTL-SDR Webレシーバー</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --field: #0f1218; --raised: #222734; --line: #2a2f3a;
    --text: #e6e8ee; --muted: #8a93a6; --dim: #555c6b;
    --accent: #4fc3f7; --accent-dim: #1e3a4a; --primary: #1e6f9f;
    --marker: #ff5252; --rec: #e5534b; --rec-dim: #7a2b2b; --ok: #5fd38d; --plot: #0b0d11;
    --mono: "BIZ UDGothic", "BIZ UDゴシック", ui-monospace, "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "BIZ UDPGothic", "BIZ UDPゴシック", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    font-size: 14px; display: flex; flex-direction: column;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- チューナーパネル ---------- */
  header {
    margin: 10px 10px 0; padding: 10px 16px 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field > .cap { color: var(--muted); font-size: 12px; }
  .row { display: flex; align-items: center; gap: 6px; }
  .spacer { flex: 1; }

  input, select, button {
    font: inherit; color: var(--text); background: var(--field);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; height: 36px;
  }
  select { padding-right: 6px; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  button { cursor: pointer; background: var(--raised); transition: border-color .12s, background .12s; }
  button:hover { border-color: var(--accent); }
  button:active { background: var(--field); }

  #freq {
    width: 7.2ch; height: 44px; padding: 0; border: none; background: transparent; text-align: right;
    font-family: var(--mono); font-size: 32px; font-weight: bold; color: var(--accent);
  }
  #freq:focus { background: var(--field); border-radius: 6px; }
  .unit { color: var(--muted); font-weight: bold; }
  .step { width: 32px; padding: 0; font-size: 18px; }

  .seg { display: flex; }
  .seg button { border-radius: 0; margin-left: -1px; padding: 0 14px; }
  .seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: #071018; font-weight: bold; position: relative; }

  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 120px; height: 36px;
    padding: 0; border: none; background: transparent;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px;
    background: linear-gradient(var(--accent), var(--accent)) 0 / var(--pct, 60%) 100% no-repeat, var(--line);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px;
    border-radius: 50%; background: var(--text); border: none;
  }
  input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
  input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--text); border: none; }
  #volPct { color: var(--muted); font-size: 12px; min-width: 3.2em; }

  .side { align-items: stretch; }
  #pill { font-size: 12px; font-weight: bold; color: var(--dim); text-align: center; white-space: nowrap; }
  #pill.ok { color: var(--ok); } #pill.err { color: #ff8a80; } #pill.wait { color: #f0b429; }
  #audioBtn {
    min-width: 140px; height: 40px; font-weight: bold;
    background: var(--primary); border-color: var(--primary);
  }
  #audioBtn.on { background: var(--rec-dim); border-color: var(--rec); }

  /* ---------- グラフ ---------- */
  main {
    flex: 1; display: flex; flex-direction: column; gap: 6px; min-height: 0;
    margin: 10px; 
  }
  canvas {
    display: block; width: 100%; cursor: crosshair; background: var(--plot);
    border: 1px solid var(--line); border-radius: 8px; touch-action: manipulation;
  }
  #spec { height: 240px; }
  #wf { flex: 1; min-height: 120px; }

  footer {
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 7px 14px; font-size: 12px; color: var(--muted); background: var(--panel);
    border-top: 1px solid var(--line);
  }
  #status.err { color: #ff8a80; }
  .hint { color: var(--dim); }

  /* ---------- スマホ ---------- */
  @media (max-width: 640px) {
    header { margin: 8px 8px 0; padding: 10px 12px; gap: 10px 14px; }
    .f-freq { flex-basis: 100%; min-width: 0; }
    .f-freq .row { min-width: 0; }
    #freq { flex: 1; width: 0; min-width: 0; font-size: 34px; text-align: right; }
    .step { width: 44px; height: 44px; }
    .spacer { display: none; }
    .side { flex-basis: 100%; }
    #audioBtn { width: 100%; height: 44px; }
    main { margin: 8px; }
    #spec { height: 180px; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="field f-freq">
    <span class="cap">周波数</span>
    <div class="row">
      <button class="step" id="down" title="下げる">−</button>
      <input id="freq" type="text" inputmode="decimal" value="80.000" aria-label="周波数 (MHz)">
      <span class="unit">MHz</span>
      <button class="step" id="up" title="上げる">＋</button>
    </div>
  </div>
  <div class="field">
    <span class="cap">モード</span>
    <div class="seg" id="mode" role="radiogroup" aria-label="モード">
      <button data-mode="WFM" class="on">WFM</button><button data-mode="NFM">NFM</button><button data-mode="AM">AM</button>
    </div>
  </div>
  <div class="field">
    <label class="cap" for="gain">ゲイン</label>
    <select id="gain"></select>
  </div>
  <div class="field">
    <label class="cap" for="vol">音量</label>
    <div class="row"><input id="vol" type="range" min="0" max="100" value="60"><span id="volPct">60%</span></div>
  </div>
  <div class="field">
    <label class="cap" for="preset">プリセット</label>
    <select id="preset">
      <option value="">選択…</option>
      <option value="WFM,80.0">FM放送 (76〜95MHz)</option>
      <option value="AM,124.0">航空無線 (118〜137MHz)</option>
      <option value="NFM,145.0">アマチュア無線 144MHz帯</option>
      <option value="AM,1090.0">ADS-B 1090MHz（表示のみ）</option>
    </select>
  </div>
  <div class="spacer"></div>
  <div class="field side">
    <span id="pill" class="wait">● 接続中</span>
    <button id="audioBtn">🔊 音声オン</button>
  </div>
</header>

<main>
  <canvas id="spec"></canvas>
  <canvas id="wf"></canvas>
</main>

<footer>
  <span id="status">接続中…</span>
  <span class="hint">クリックで選局 ／ ホイールで微調整</span>
</footer>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const specCv = $("spec"), wfCv = $("wf");
const specCtx = specCv.getContext("2d"), wfCtx = wfCv.getContext("2d");

let ws = null;
let state = { freq: 80e6, mode: "WFM", gain: 29.7, fs: 1.2e6, audioFs: 48000 };
let hw = null, avg = null, floor = -60;
let player = null;

// ---------- カラーマップ（inferno風） ----------
const LUT = (() => {
  const stops = [[0, [0, 0, 4]], [0.25, [87, 16, 110]], [0.5, [188, 55, 84]],
                 [0.75, [249, 142, 9]], [1, [252, 255, 164]]];
  const lut = new Uint8ClampedArray(256 * 3);
  for (let i = 0; i < 256; i++) {
    const t = i / 255;
    let k = 0;
    while (k < stops.length - 2 && t > stops[k + 1][0]) k++;
    const [t0, c0] = stops[k], [t1, c1] = stops[k + 1];
    const f = (t - t0) / (t1 - t0);
    for (let j = 0; j < 3; j++) lut[i * 3 + j] = c0[j] + (c1[j] - c0[j]) * f;
  }
  return lut;
})();

// ---------- 音声再生（HTTPでも動く ScriptProcessor 方式） ----------
class Player {
  constructor(rate) {
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AC({ sampleRate: rate });
    this.rate = rate;
    this.buf = new Float32Array(rate * 2);
    this.r = 0; this.w = 0; this.n = 0; this.ready = false;
    this.gain = this.ctx.createGain();
    this.node = this.ctx.createScriptProcessor(2048, 1, 1);
    this.node.onaudioprocess = (e) => this.fill(e.outputBuffer.getChannelData(0));
    this.node.connect(this.gain).connect(this.ctx.destination);
    if (this.ctx.state === "suspended") this.ctx.resume();   // ブラウザによっては停止状態で作られる
  }
  fill(out) {
    if (!this.ready) {                       // 0.2秒ためてから再生開始
      if (this.n < this.rate * 0.2) { out.fill(0); return; }
      this.ready = true;
    }
    const L = this.buf.length;
    for (let i = 0; i < out.length; i++) {
      if (this.n > 0) { out[i] = this.buf[this.r]; this.r = (this.r + 1) % L; this.n--; }
      else { out[i] = 0; this.ready = false; }
    }
  }
  push(pcm) {
    const L = this.buf.length, max = this.rate * 0.6;
    for (let i = 0; i < pcm.length; i++) {
      this.buf[this.w] = pcm[i] / 32768; this.w = (this.w + 1) % L;
    }
    this.n += pcm.length;
    if (this.n > max) { const drop = this.n - this.rate * 0.3; this.r = (this.r + drop) % L; this.n -= drop; }
  }
  setVolume(v) { this.gain.gain.value = v; }
  close() { this.ctx.close(); }
}

// ---------- 通信 ----------
function connect() {
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => setStatus("接続しました");
  ws.onclose = () => {
    setPill(["● 再接続中", "wait"]);
    setStatus("切断されました。再接続しています…", true); setTimeout(connect, 2000);
  };
  ws.onmessage = (ev) => {
    if (typeof ev.data === "string") { onState(JSON.parse(ev.data)); return; }
    const type = new Uint8Array(ev.data, 0, 1)[0];
    if (type === 1) {
      const center = new DataView(ev.data).getFloat64(8, true);
      onSpectrum(new Float32Array(ev.data, 16), center);
    } else if (type === 2 && player) {
      player.push(new Int16Array(ev.data, 8));
    }
  };
}
function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

function onState(s) {
  if (s.type !== "state") return;
  state = { ...state, ...s };
  if (document.activeElement !== $("freq")) $("freq").value = (s.freq / 1e6).toFixed(3);
  setModeUI(s.mode);
  if ($("gain").options.length === 0) {
    $("gain").add(new Option("自動", "auto"));
    s.gains.forEach((g) => $("gain").add(new Option(`${g.toFixed(1)} dB`, g)));
  }
  $("gain").value = s.gain === "auto" ? "auto" : String(s.gain);
  setPill(s.error ? ["● エラー", "err"] : s.running ? ["● 受信中", "ok"] : ["● 待機中", ""]);
  if (s.error) setStatus(s.error + "（ページを再読み込みすると再試行します）", true);
  else setStatus(`${s.running ? "受信中" : "待機中"}  ${(s.freq / 1e6).toFixed(3)} MHz  ${s.mode}` +
                 `  ／ 接続数 ${s.clients ?? 1}${s.demo ? "  ［デモモード］" : ""}`);
  drawSpectrum();
}
function setPill([text, cls]) { $("pill").textContent = text; $("pill").className = cls; }
function setStatus(t, err = false) { $("status").textContent = t; $("status").classList.toggle("err", err); }

// ---------- 選局 ----------
function stepMHz() { return state.mode === "WFM" ? 0.1 : 0.005; }
function tune(mhz) {
  const st = stepMHz();
  mhz = Math.round(mhz / st) * st;
  state.freq = mhz * 1e6;
  $("freq").value = mhz.toFixed(3);
  send({ cmd: "set", freq: state.freq });
  drawSpectrum();
}
$("freq").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { const v = parseFloat($("freq").value); if (!isNaN(v)) tune(v); $("freq").blur(); }
});
$("freq").addEventListener("blur", () => { $("freq").value = (state.freq / 1e6).toFixed(3); });
$("up").onclick = () => tune(state.freq / 1e6 + stepMHz());
$("down").onclick = () => tune(state.freq / 1e6 - stepMHz());
function setModeUI(m) {
  document.querySelectorAll("#mode button").forEach((b) => {
    b.classList.toggle("on", b.dataset.mode === m);
    b.setAttribute("aria-checked", b.dataset.mode === m);
  });
}
document.querySelectorAll("#mode button").forEach((b) => {
  b.onclick = () => {
    if (state.mode === b.dataset.mode) return;
    state.mode = b.dataset.mode; setModeUI(state.mode);
    send({ cmd: "set", mode: state.mode });
  };
});
$("gain").onchange = () => send({ cmd: "set", gain: $("gain").value === "auto" ? "auto" : parseFloat($("gain").value) });
$("preset").onchange = () => {
  const v = $("preset").value; if (!v) return;
  const [mode, f] = v.split(",");
  state.mode = mode; setModeUI(mode);
  send({ cmd: "set", mode, freq: parseFloat(f) * 1e6 });
  $("preset").value = "";
};

function xToMHz(cv, clientX) {
  const rect = cv.getBoundingClientRect();
  return (hw + ((clientX - rect.left) / rect.width - 0.5) * state.fs) / 1e6;
}
[specCv, wfCv].forEach((cv) => {
  cv.addEventListener("click", (e) => { if (hw !== null) tune(xToMHz(cv, e.clientX)); });
  cv.addEventListener("wheel", (e) => {
    e.preventDefault();
    tune(state.freq / 1e6 + (e.deltaY < 0 ? 1 : -1) * stepMHz());
  }, { passive: false });
});

// ---------- 音声 ----------
function showVol() {
  const v = $("vol").value;
  $("volPct").textContent = `${v}%`;
  $("vol").style.setProperty("--pct", `${v}%`);
}
$("vol").oninput = () => { showVol(); if (player) player.setVolume($("vol").value / 100); };
showVol();
$("audioBtn").onclick = () => {
  if (player) {
    player.close(); player = null;
    $("audioBtn").textContent = "🔊 音声オン"; $("audioBtn").classList.remove("on");
  } else {
    player = new Player(state.audioFs || 48000);
    player.setVolume($("vol").value / 100);
    $("audioBtn").textContent = "🔇 音声オフ"; $("audioBtn").classList.add("on");
  }
};

// ---------- 描画 ----------
function resize() {
  const dpr = window.devicePixelRatio || 1;
  for (const cv of [specCv, wfCv]) {
    const w = Math.round(cv.clientWidth * dpr), h = Math.round(cv.clientHeight * dpr);
    if (cv.width !== w || cv.height !== h) {
      cv.width = w; cv.height = h;
      if (cv === wfCv) { wfCtx.fillStyle = "#000"; wfCtx.fillRect(0, 0, w, h); }
    }
  }
  drawSpectrum();
}
window.addEventListener("resize", resize);

function binToPixels(db, width) {   // 各ピクセルに対応するビンの最大値
  const out = new Float32Array(width), n = db.length;
  for (let x = 0; x < width; x++) {
    const i0 = Math.floor(x * n / width), i1 = Math.max(i0 + 1, Math.floor((x + 1) * n / width));
    let m = -1e9;
    for (let i = i0; i < i1; i++) if (db[i] > m) m = db[i];
    out[x] = m;
  }
  return out;
}

function onSpectrum(db, center) {
  if (center !== hw) {                 // 周波数が変わったらリセット
    hw = center; avg = Float32Array.from(db);
    wfCtx.fillStyle = "#000"; wfCtx.fillRect(0, 0, wfCv.width, wfCv.height);
  } else {
    for (let i = 0; i < db.length; i++) avg[i] = 0.6 * avg[i] + 0.4 * db[i];
  }
  const sorted = Float32Array.from(db).sort();
  floor = 0.9 * floor + 0.1 * sorted[sorted.length >> 1];
  drawSpectrum();
  drawWaterfall(db);
}

function niceStep(spanMHz, px) {
  for (const s of [0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1]) if (px * s / spanMHz >= 90) return s;
  return 1;
}

function drawSpectrum() {
  const c = specCtx, W = specCv.width, H = specCv.height;
  if (!W || !H) return;
  const dpr = window.devicePixelRatio || 1;
  c.clearRect(0, 0, W, H);
  if (hw === null || !avg) return;

  const top = floor + 60, bot = floor - 10;
  const y = (v) => H - (v - bot) / (top - bot) * H;
  const f0 = (hw - state.fs / 2) / 1e6, span = state.fs / 1e6;
  c.font = `${11 * dpr}px "BIZ UDGothic", ui-monospace, monospace`;
  c.lineWidth = 1;

  // 横グリッド（dB）
  c.strokeStyle = "#1f2430"; c.fillStyle = "#6b7488";
  for (let v = Math.ceil(bot / 10) * 10; v < top; v += 10) {
    c.beginPath(); c.moveTo(0, y(v)); c.lineTo(W, y(v)); c.stroke();
    c.fillText(`${v.toFixed(0)} dB`, 4 * dpr, y(v) - 3 * dpr);
  }
  // 縦グリッド（周波数）
  const st = niceStep(span, W);
  for (let f = Math.ceil(f0 / st) * st; f < f0 + span; f += st) {
    const x = (f - f0) / span * W;
    c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke();
    if (x > 50 * dpr) c.fillText(f.toFixed(st < 0.1 ? 2 : 1), x + 3 * dpr, H - 5 * dpr);
  }
  // スペクトラム
  const px = binToPixels(avg, W);
  c.beginPath();
  for (let x = 0; x < W; x++) { const yy = y(px[x]); x ? c.lineTo(x, yy) : c.moveTo(x, yy); }
  c.strokeStyle = "#4fc3f7"; c.lineWidth = 1.2 * dpr; c.stroke();
  c.lineTo(W, H); c.lineTo(0, H); c.closePath();
  c.fillStyle = "rgba(79,195,247,0.12)"; c.fill();

  // 選局マーカー
  const mx = (state.freq / 1e6 - f0) / span * W;
  c.strokeStyle = "#ff5252"; c.lineWidth = 2 * dpr;
  c.beginPath(); c.moveTo(mx, 0); c.lineTo(mx, H); c.stroke();
  c.fillStyle = "#ff8a80"; c.font = `bold ${13 * dpr}px "BIZ UDGothic", ui-monospace, monospace`;
  const label = `${(state.freq / 1e6).toFixed(3)} MHz`;
  const tw = c.measureText(label).width;
  c.fillText(label, Math.min(mx + 6 * dpr, W - tw - 4 * dpr), 16 * dpr);
}

function drawWaterfall(db) {
  const W = wfCv.width, H = wfCv.height;
  if (!W || !H) return;
  wfCtx.drawImage(wfCv, 0, 0, W, H - 1, 0, 1, W, H - 1);   // 1行下へずらす
  const px = binToPixels(db, W);
  const row = wfCtx.createImageData(W, 1), d = row.data;
  const lo = floor - 3, hi = floor + 40;
  for (let x = 0; x < W; x++) {
    let v = Math.round((px[x] - lo) / (hi - lo) * 255);
    v = v < 0 ? 0 : v > 255 ? 255 : v;
    d[x * 4] = LUT[v * 3]; d[x * 4 + 1] = LUT[v * 3 + 1]; d[x * 4 + 2] = LUT[v * 3 + 2]; d[x * 4 + 3] = 255;
  }
  wfCtx.putImageData(row, 0, 0);
}

resize();
connect();
</script>
</body>
</html>
